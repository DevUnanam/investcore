{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete User | Nervex AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="{% url 'dashboard:home' %}">Nervex <span>AI</span></a>
        <nav>
          <a href="{% url 'dashboard:home' %}">Overview</a>
          <a class="active" href="{% url 'dashboard:users' %}">Users</a>
          <a href="{% url 'accounts:profile' %}">Profile</a>
        </nav>
      </aside>
      <section class="content">
        <section class="confirm-panel">
          <p>Delete user</p>
          <h1>{{ user_obj.get_full_name|default:user_obj.username }}</h1>
          <span>This permanently removes the account and its profile.</span>
          <form method="post">
            {% csrf_token %}
            <button type="submit">Delete User</button>
            <a href="{% url 'dashboard:users' %}">Cancel</a>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
